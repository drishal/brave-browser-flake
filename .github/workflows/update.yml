name: Update Brave Channels

on:
  schedule:
    - cron: '30 5 * * *' # Run daily at 5:30 UTC — after Brave beta's ~05:27 weekday publish
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Each channel is updated and built on its own. A channel that fails to
      # fetch or build is rolled back and the rest still go through, so one bad
      # upstream release can no longer block every other channel's updates.
      - name: Update and verify each channel
        id: update
        run: |
          chmod +x update.sh
          updated=()
          failed=()

          for channel in brave-nightly brave-beta brave-origin-nightly brave-stable brave-origin-beta; do
            echo "::group::$channel"
            if ./update.sh "$channel" && nix build ".#$channel" --accept-flake-config; then
              if git diff --quiet -- "pkgs/$channel.nix"; then
                echo "$channel: already up to date"
              else
                echo "$channel: updated to $(sed -n 's/.*version = "\(.*\)".*/\1/p' "pkgs/$channel.nix")"
                updated+=("$channel")
              fi
            else
              echo "$channel: FAILED — rolling back"
              git checkout -- "pkgs/$channel.nix"
              failed+=("$channel")
            fi
            echo "::endgroup::"
          done

          # Name the versions in the commit message so the log is readable.
          msg="chore: update brave versions"
          for channel in "${updated[@]}"; do
            msg="$msg — $channel $(sed -n 's/.*version = "\(.*\)".*/\1/p' "pkgs/$channel.nix")"
          done
          echo "commit_message=$msg" >>"$GITHUB_OUTPUT"
          echo "failed=${failed[*]}" >>"$GITHUB_OUTPUT"

          {
            echo "### Brave channel update"
            echo "- updated: ${updated[*]:-none}"
            echo "- failed: ${failed[*]:-none}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.update.outputs.commit_message }}
          file_pattern: pkgs/*.nix
          branch: master

      # Surface a red run for the channels that broke, but only after the
      # healthy ones have been committed and pushed.
      - name: Report failed channels
        if: steps.update.outputs.failed != ''
        run: |
          echo "These channels failed to update: ${{ steps.update.outputs.failed }}"
          exit 1
